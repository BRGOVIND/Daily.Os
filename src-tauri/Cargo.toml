[package]
name = "daily-os"
version = "3.1.0"
description = "Daily OS — offline-first personal operating system"
authors = ["Daily OS"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop binary links against. `_lib` avoids a name clash with
# the binary on Windows.
[lib]
name = "daily_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Desktop-only plugins (not compiled for mobile targets).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[features]
# Reserved for the future updater; kept off until signing keys exist.
updater = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
